<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awzan Construction - Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #ffffff;
            --text-secondary: #b8c5d6;
            --accent: #1a3a5c;
            --accent-light: #2d5a87;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background layer */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            filter: blur(3px) brightness(0.6);
            transform: scale(1.05); /* Prevent blur edge artifacts */
        }

        /* Hat layer with parallax */
        .hat-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        .hat-image {
            max-width: 50%;
            max-height: 60%;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
        }

        /* Dark overlay for better text readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2) 0%,
                rgba(0, 0, 0, 0.1) 50%,
                rgba(0, 0, 0, 0.4) 100%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* Logo */
        .logo {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            animation: fadeInUp 0.8s ease-out;
        }

        .logo img {
            height: 100px;
            width: auto;
            filter: brightness(0) invert(1) drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        /* Content */
        .content {
            text-align: center;
            max-width: 700px;
            margin-top: 15vh;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease-out;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .badge-dot {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        h1 {
            font-size: clamp(36px, 7vw, 64px);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            color: var(--text-primary);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Social links */
        .social-links {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            z-index: 4;
        }

        .social-link {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.8;
            z-index: 4;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        .footer a {
            color: var(--text-primary);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                top: 30px;
            }

            .logo img {
                height: 50px;
            }

            .hat-image {
                max-width: 70%;
                max-height: 50%;
            }

            .content {
                margin-top: 20vh;
            }

            .badge {
                padding: 12px 24px;
                font-size: 14px;
                letter-spacing: 2px;
            }

            .social-links {
                bottom: 80px;
                gap: 12px;
            }

            .social-link {
                width: 44px;
                height: 44px;
            }

            .social-link svg {
                width: 20px;
                height: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                top: 20px;
            }

            .logo img {
                height: 40px;
            }

            .hat-image {
                max-width: 85%;
                max-height: 45%;
            }

            .content {
                margin-top: 25vh;
            }

            .badge {
                padding: 10px 20px;
                font-size: 12px;
                letter-spacing: 1.5px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .social-links {
                bottom: 70px;
                gap: 10px;
                flex-wrap: wrap;
                padding: 0 20px;
            }

            .social-link {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }

            .social-link svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>

    <script>
        // Parallax effect for the hat on mouse move
        const hatLayer = document.getElementById('hatLayer');

        document.addEventListener('mousemove', function(e) {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            // Calculate offset from center (range: -1 to 1)
            const offsetX = (x - 0.5) * 2;
            const offsetY = (y - 0.5) * 2;

            // Apply parallax effect - hat moves in opposite direction for depth
            const moveX = offsetX * 30; // Adjust multiplier for more/less movement
            const moveY = offsetY * 20;

            hatLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Touch support for mobile devices
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const x = touch.clientX / window.innerWidth;
                const y = touch.clientY / window.innerHeight;

                const offsetX = (x - 0.5) * 2;
                const offsetY = (y - 0.5) * 2;

                const moveX = offsetX * 20;
                const moveY = offsetY * 15;

                hatLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset position on mouse leave
        document.addEventListener('mouseleave', function() {
            hatLayer.style.transform = 'translate(0, 0)';
        });

        // Device orientation support for mobile parallax
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(e) {
                if (e.gamma !== null && e.beta !== null) {
                    // gamma: -90 to 90 (left to right tilt)
                    // beta: -180 to 180 (front to back tilt)
                    const moveX = (e.gamma / 90) * 20;
                    const moveY = ((e.beta - 45) / 90) * 15; // Offset by 45 for natural phone holding

                    hatLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
    </script>
